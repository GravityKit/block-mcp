name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  php:
    name: PHP plugin (PHPUnit, real WP + SQLite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: wordpress-plugin/gk-block-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none
          ini-values: error_reporting=E_ALL, memory_limit=512M

      # Composer's global download cache. Keyed on composer.lock so the
      # cache busts only when dependencies actually change.
      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php-version }}-${{ hashFiles('wordpress-plugin/gk-block-api/composer.lock') }}
          restore-keys: |
            composer-${{ matrix.php-version }}-

      # vendor/ itself, so the install step is a no-op when composer.lock
      # AND the SQLite-drop-in installer script are both unchanged. The
      # script's hash is part of the key because it decides which commit
      # of the upstream SQLite plugin gets cloned.
      - name: Cache vendor/
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: wordpress-plugin/gk-block-api/vendor
          key: vendor-${{ matrix.php-version }}-${{ hashFiles('wordpress-plugin/gk-block-api/composer.lock', 'wordpress-plugin/gk-block-api/tests/install-sqlite-dropin.php') }}

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-progress --no-interaction

      # composer post-install runs the SQLite installer only on a fresh
      # install; if vendor/ came from cache, re-run it explicitly so
      # both paths produce an identical state.
      - name: Ensure SQLite drop-in is installed
        run: composer run-script install-sqlite-dropin

      - name: Run PHPUnit
        run: vendor/bin/phpunit -c tests/phpunit.xml --colors=never

  ts:
    name: TypeScript MCP server (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm test

      - run: npm run build
