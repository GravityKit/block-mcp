name: Build plugin ZIP

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & publish gk-block-api.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ZIP
        run: |
          set -euo pipefail
          # Stage the plugin into a temp directory using rsync with the
          # plugin's own .distignore as the exclude list — single source of
          # truth, no drift between this workflow and what `wp dist-archive`
          # produces locally. rsync reads .distignore as gitignore-style
          # patterns so it matches both top-level files and nested
          # occurrences (e.g. .DS_Store anywhere in the tree).
          stage="$(mktemp -d)"
          mkdir -p "$stage/gk-block-api"
          rsync -a \
            --exclude-from='wordpress-plugin/gk-block-api/.distignore' \
            wordpress-plugin/gk-block-api/ "$stage/gk-block-api/"
          (cd "$stage" && zip -rq "$GITHUB_WORKSPACE/gk-block-api.zip" gk-block-api)
          unzip -l gk-block-api.zip | tail -5

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gk-block-api
          path: gk-block-api.zip
          retention-days: 90

      - name: Update rolling 'latest' release (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (main)
          body: |
            Rolling build of `main`. Auto-updated on every push.

            Commit: ${{ github.sha }}

            Install the ZIP via WordPress admin → Plugins → Add New → Upload.
          prerelease: true
          files: gk-block-api.zip

      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: gk-block-api.zip
